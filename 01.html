
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALK 1 — Never Finished</title>

<style>
:root {
  --black: #000;
  --white: #f2f2f2;
  --yellow: #eaff00;
  --progress: 0%;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
}

body {
  font-family: Futura, "Arial Black", Arial, sans-serif;
  color: var(--white);
}

/* PRECIES EEN SCHERM */

.screen {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--black);
}

/* WALK NEEMT ALLE BESCHIKBARE RUIMTE IN */

.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  cursor: crosshair;
  touch-action: none;
}

.typography {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/*
  DIT IS GEEN HORIZONTALE REVEAL.

  De route volgt de vormen van de letters.
  De gele lijn wordt letterlijk over
  datzelfde pad getekend.
*/

.letter-route {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* HET NOG NIET AFGELEGDE TRAJECT */

.unfinished {
  stroke: var(--white);
  stroke-width: 13;
  stroke-dasharray: 1 25;
  opacity: .8;
}

/* HET AFGELEGDE TRAJECT */

.finished {
  stroke: var(--yellow);
  stroke-width: 15;
  stroke-dasharray: 0 100000;
  filter: none;
}

/* GELE LOCATIEPIN */

.route-pin {
  pointer-events: none;
}

.pin-ring {
  fill: var(--black);
  stroke: var(--yellow);
  stroke-width: 5;
}

.pin-center {
  fill: var(--yellow);
}

/* SLIDER: ONGEVEER 1 CM */

.timeline-area {
  height: 38px;
  flex: 0 0 38px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  background: var(--black);
}

.timeline {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 30px;
  margin: 0;
  outline: none;
  background: transparent;
  cursor: ew-resize;
  touch-action: none;
}

.timeline::-webkit-slider-runnable-track {
  height: 3px;
  background:
    linear-gradient(
      to right,
      var(--yellow) 0%,
      var(--yellow) var(--progress),
      transparent var(--progress)
    ),
    repeating-linear-gradient(
      to right,
      #777 0px,
      #777 2px,
      transparent 2px,
      transparent 9px
    );
}

.timeline::-moz-range-track {
  height: 3px;
  background:
    linear-gradient(
      to right,
      var(--yellow) 0%,
      var(--yellow) var(--progress),
      transparent var(--progress)
    ),
    repeating-linear-gradient(
      to right,
      #777 0px,
      #777 2px,
      transparent 2px,
      transparent 9px
    );
}

.timeline::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  margin-top: -5px;
  border: 0;
  border-radius: 50%;
  background: var(--yellow);
}

.timeline::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: 0;
  border-radius: 50%;
  background: var(--yellow);
}

/* GEEN SCROLLEN OP TELEFOON */

@media(max-width: 600px) {
  .timeline-area {
    padding: 0 12px;
  }

  .unfinished {
    stroke-width: 16;
  }

  .finished {
    stroke-width: 18;
  }
}

@media(prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>

<main class="screen">

  <section class="stage" id="stage"
           aria-label="Interactive WALK typography">

    <svg
      class="typography"
      id="svg"
      viewBox="0 0 1000 500"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg">

      <!--
        EEN ENKELE DOORLOPENDE ROUTE.

        BEGIN: linksonder in de W.

        De lijn volgt de geometrische
        lettervormen W A L K.

        Daarna loopt het traject terug
        door andere delen van de letters
        en eindigt linksboven bij de W.

        Er is geen horizontale
        clipping of reveal.
      -->

      <defs>
        <path id="walkRoute" d="
          M 34 463

          L 84 39
          L 158 344
          L 224 39
          L 275 463

          L 309 463
          L 383 39
          L 457 463
          L 429 278
          L 343 278
          L 429 278
          L 457 463

          L 500 463
          L 500 39
          L 500 463
          L 671 463

          L 708 463
          L 708 39
          L 708 258
          L 958 39
          L 708 258
          L 958 463

          L 922 463
          L 748 288
          L 748 67
          L 748 288
          L 920 67

          L 663 67
          L 540 67
          L 540 426
          L 644 426
          L 540 426
          L 540 67

          L 480 67
          L 385 79
          L 331 421
          L 385 79
          L 436 421
          L 385 79

          L 249 68
          L 199 333
          L 158 93
          L 98 435
          L 56 39
        "/>
      </defs>

      <!-- VOLLEDIGE ROUTE IN WITTE STIPPEN -->
      <use
        href="#walkRoute"
        class="letter-route unfinished"/>

      <!-- DEZELFDE ROUTE IN GEEL -->
      <use
        href="#walkRoute"
        id="finishedPath"
        class="letter-route finished"/>

      <!-- DE PIN DIE HET PAD VOLGT -->
      <g class="route-pin" id="routePin">
        <circle class="pin-ring" r="14"/>
        <circle class="pin-center" r="4"/>
      </g>

    </svg>

  </section>

  <div class="timeline-area">

    <input
      class="timeline"
      id="timeline"
      type="range"
      min="0"
      max="1000"
      value="0"
      step="1"
      aria-label="Walk along the letters">

  </div>

</main>

<script>

/*
  WALK 1

  Slechts een interactie:
  een traject door de typografie.

  0% = linksonder in W
  100% = linksboven in W
*/

const svg = document.getElementById("svg");
const route = document.getElementById("walkRoute");
const finished = document.getElementById("finishedPath");
const pin = document.getElementById("routePin");
const timeline = document.getElementById("timeline");
const stage = document.getElementById("stage");

const length = route.getTotalLength();

/*
  DE GELE ROUTE WORDT GETEKEND
  VIA DE ECHTE PADLENGTE.

  Dus NIET met een rechthoek
  die van links naar rechts schuift.
*/

finished.style.strokeDasharray = `0 ${length}`;
finished.style.strokeDashoffset = "0";

function updateWalk(value) {

  const progress = Math.max(
    0,
    Math.min(1, Number(value) / 1000)
  );

  const travelled = progress * length;

  // Alleen de afgelegde padlengte wordt geel.
  finished.style.strokeDasharray =
    `${travelled} ${length + 1}`;

  // De pin volgt exact hetzelfde pad.
  const point = route.getPointAtLength(travelled);

  pin.setAttribute(
    "transform",
    `translate(${point.x} ${point.y})`
  );

  // De kleine slider loopt mee.
  document.documentElement.style.setProperty(
    "--progress",
    (progress * 100) + "%"
  );

  timeline.value = Math.round(progress * 1000);
}

/* DE SLIDER */

timeline.addEventListener("input", event => {
  updateWalk(event.target.value);
});

/*
  KLIK OP DE LETTERROUTE.

  Zoek het dichtstbijzijnde punt
  van het volledige wandeltraject.

  Zo kun je ook rechtstreeks
  ergens op WALK stoppen.
*/

function choosePoint(event) {

  const svgPoint = svg.createSVGPoint();
  svgPoint.x = event.clientX;
  svgPoint.y = event.clientY;

  const matrix = svg.getScreenCTM();
  if (!matrix) return;

  const position = svgPoint.matrixTransform(
    matrix.inverse()
  );

  const samples = 1200;
  let nearestLength = 0;
  let nearestDistance = Infinity;

  for (let i = 0; i <= samples; i++) {

    const currentLength = (i / samples) * length;
    const point = route.getPointAtLength(currentLength);

    const dx = point.x - position.x;
    const dy = point.y - position.y;

    const distance = dx * dx + dy * dy;

    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearestLength = currentLength;
    }
  }

  const value = nearestLength / length * 1000;

  updateWalk(value);
}

stage.addEventListener("pointerdown", event => {
  stage.setPointerCapture(event.pointerId);
  choosePoint(event);
});

stage.addEventListener("pointermove", event => {
  if (event.buttons === 1) {
    choosePoint(event);
  }
});

/* BEGIN LINKSONDER */

updateWalk(0);

</script>

</body>
</html>
