
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WALK 2 — Archive</title>

<style>
:root {
  --wall: #f7f6f2;
  --ink: #191919;
  --muted: #888680;
  --gap: 28px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--wall);
}

body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: Futura, Helvetica, Arial, sans-serif;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

/* MINIMALE NAVIGATIE */

header {
  padding: 25px clamp(20px, 4vw, 65px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  font-size: 11px;
}

header a {
  color: inherit;
  text-decoration: none;
  font-weight: 700;
}

header a:hover {
  text-decoration: underline;
}

header span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
}

/* DE GALERIJ */

.gallery {
  min-height: 85vh;
  padding:
    clamp(60px, 10vh, 130px)
    clamp(24px, 6vw, 110px)
    12vh;
}

.wall {
  display: flex;
  flex-direction: column;

  /* ALLE RIJEN KRIJGEN DEZELFDE AFSTAND */
  gap: var(--gap);
}

/* ELKE RIJ IS EEN GECUREERDE COMPOSITIE */

.gallery-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;

  /* ALLE FOTO'S DEZELFDE AFSTAND */
  gap: var(--gap);
}

.artwork {
  display: block;
  flex: 0 0 auto;
  min-width: 0;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: left;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  transition: opacity .2s ease;
}

.artwork:hover img {
  opacity: .82;
}

/* MUSEUMNUMMER ONDER DE FOTO */

.artwork-number {
  display: block;
  height: 22px;
  padding-top: 8px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .06em;
}

/* ONTBREKENDE FOTO */

.missing {
  width: 100%;
  padding: 20px;
  background: #e5e4df;
  color: #777;
  font: 11px/1.5 Arial, sans-serif;
  overflow-wrap: anywhere;
}

/* FOOTER */

footer {
  padding: 25px clamp(20px, 4vw, 65px);
  display: flex;
  justify-content: space-between;
  gap: 15px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .05em;
}

footer a {
  color: inherit;
  text-decoration: none;
}

/* FOTO OPENEN */

.viewer {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  background: var(--wall);
  padding: 50px 20px 30px;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}

.viewer.open {
  display: flex;
}

.viewer-close {
  position: absolute;
  top: 25px;
  right: clamp(20px, 4vw, 65px);
  border: none;
  background: transparent;
  font: 12px Futura, Arial, sans-serif;
  color: var(--ink);
  cursor: pointer;
}

/*
  DE FOTO EN TEKST HOREN BIJ ELKAAR.

  De tekst krijgt exact de breedte van
  de weergegeven afbeelding.
*/

.viewer-work {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  max-width: 100%;
  max-height: 100%;
}

.viewer-image {
  display: block;
  width: auto;
  height: auto;
  max-width: 88vw;
  max-height: 65vh;
  object-fit: contain;
}

.viewer-info {
  width: 100%;
  margin-top: 22px;
  text-align: left;
}

.viewer-date {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .07em;
}

.viewer-title {
  margin: 15px 0 8px;
  font-size: clamp(21px, 3vw, 40px);
  line-height: 1;
  font-weight: 900;
  letter-spacing: -.055em;
}

.viewer-note {
  margin: 0;
  font: 13px/1.5 Arial, sans-serif;
  color: #777;
}

/* MOBIEL */

@media(max-width: 700px) {
  :root {
    --gap: 16px;
  }

  header {
    padding: 20px;
  }

  .gallery {
    padding: 55px 18px 90px;
  }

  .gallery-row {
    flex-wrap: nowrap;
  }

  .viewer-image {
    max-width: 100%;
    max-height: 55vh;
  }

  .viewer-title {
    font-size: clamp(20px, 6vw, 30px);
  }
}

@media(prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">← WALK</a>
  <span>ARCHIVE / 002</span>
</header>

<main class="gallery">
  <div class="wall" id="wall"></div>
</main>

<footer>
  <span id="counter">WALK / OBSERVATIONS</span>
  <a href="index.html">NEVER FINISHED ↗</a>
</footer>

<!-- GROTE FOTO MET UITGELIJNDE TEKST -->

<div class="viewer"
     id="viewer"
     role="dialog"
     aria-modal="true"
     aria-label="Observation detail">

  <button class="viewer-close" id="close">
    CLOSE ×
  </button>

  <div class="viewer-work" id="viewerWork">

    <img class="viewer-image"
         id="largeImage"
         alt="">

    <div class="viewer-info" id="viewerInfo">
      <div class="viewer-date" id="viewerDate"></div>
      <h2 class="viewer-title" id="viewerTitle"></h2>
      <p class="viewer-note" id="viewerNote"></p>
    </div>

  </div>

</div>

<script>

/*
  JOUW FOTOARCHIEF

  De foto's blijven in je map "beeld".
*/

const observations = [
  {
    date: "22.10.2026",
    image: "beeld/huis-01.jpg",
    title: "THE HOUSE GAVE UP.",
    note: "The windows are still pretending."
  },
  {
    date: "22.10.2026",
    image: "beeld/plant-01.jpg",
    title: "THE PLANT LOOKED SAD.",
    note: "Nobody seemed particularly concerned."
  },
  {
    date: "25.10.2026",
    image: "beeld/straat-01.jpg",
    title: "A VERY PRIVATE DISASTER.",
    note: "Everyone walked past it."
  },
  {
    date: "29.10.2026",
    image: "beeld/huis-02.jpg",
    title: "NOBODY LIVES HERE.",
    note: "But someone still cuts the grass."
  },
  {
    date: "02.11.2026",
    image: "beeld/detail-01.jpg",
    title: "STILL WAITING.",
    note: "For what, exactly?"
  }
];

const wall = document.getElementById("wall");
const viewer = document.getElementById("viewer");
const largeImage = document.getElementById("largeImage");
const viewerWork = document.getElementById("viewerWork");
const viewerInfo = document.getElementById("viewerInfo");

let photoData = [];
let lastFocus = null;

/* LEES DE ECHTE FOTOAFMETINGEN */

function loadImage(item) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => resolve({
      ...item,
      ratio: img.naturalWidth / img.naturalHeight,
      loaded: true
    });

    img.onerror = () => resolve({
      ...item,
      ratio: 1,
      loaded: false
    });

    img.src = item.image;
  });
}

/*
  FOTO'S WORDEN IN RIJEN VERDEELD.

  Een rij bevat een hoeveelheid beelden
  afhankelijk van hun verhoudingen.

  Hierdoor reageren de rijen op
  staande en liggende foto's.
*/

function arrangeRows(items) {
  const rows = [];
  let row = [];
  let ratioSum = 0;

  const mobile = window.innerWidth <= 700;
  const targetRatio = mobile ? 1.7 : 3.2;

  items.forEach(item => {
    const ratio = Math.max(.5, Math.min(item.ratio, 3));

    if (
      row.length > 0 &&
      ratioSum + ratio > targetRatio
    ) {
      rows.push(row);
      row = [];
      ratioSum = 0;
    }

    row.push(item);
    ratioSum += ratio;
  });

  if (row.length > 0) {
    rows.push(row);
  }

  return rows;
}

/*
  OPEN EEN FOTO EN ZORG DAT DE TEKST
  PRECIES LINKS MET DE FOTO UITLIJNT.
*/

function alignViewerText() {
  if (!viewer.classList.contains("open")) return;

  const imageWidth = largeImage.getBoundingClientRect().width;

  if (imageWidth > 0) {
    viewerInfo.style.width = imageWidth + "px";
  }
}

function openViewer(item, index) {
  lastFocus = document.activeElement;

  viewerInfo.style.width = "";
  largeImage.src = item.image;
  largeImage.alt = item.title;

  document.getElementById("viewerDate").textContent =
    String(index + 1).padStart(3, "0") +
    " / " + item.date;

  document.getElementById("viewerTitle").textContent =
    item.title;

  document.getElementById("viewerNote").textContent =
    item.note;

  viewer.classList.add("open");
  document.body.style.overflow = "hidden";

  if (largeImage.complete) {
    alignViewerText();
  }

  document.getElementById("close").focus();
}

largeImage.addEventListener("load", alignViewerText);

function closeViewer() {
  viewer.classList.remove("open");
  document.body.style.overflow = "";
  largeImage.removeAttribute("src");

  if (lastFocus) {
    lastFocus.focus();
  }
}

document.getElementById("close")
  .addEventListener("click", closeViewer);

viewer.addEventListener("click", event => {
  if (event.target === viewer) {
    closeViewer();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeViewer();
});

/*
  BOUW EEN GALERIJ MET EXACTE TUSSENRUIMTES.

  Iedere rij krijgt:
  - dezelfde horizontale gap
  - dezelfde verticale gap
  - de nummers onder de foto
  - geen overlap met een volgende rij
*/

function renderGallery() {
  wall.innerHTML = "";

  const rows = arrangeRows(photoData);
  const mobile = window.innerWidth <= 700;
  const gap = mobile ? 16 : 28;

  const availableWidth = wall.clientWidth;
  const maxHeight = mobile ? 300 : 420;

  rows.forEach(rowItems => {
    const row = document.createElement("div");
    row.className = "gallery-row";

    const ratioSum = rowItems.reduce(
      (sum, item) => sum + item.ratio,
      0
    );

    const usableWidth = Math.max(
      100,
      availableWidth - (rowItems.length - 1) * gap
    );

    // De foto's worden als een echte groep verdeeld.
    const imageHeight = Math.min(
      usableWidth / ratioSum,
      maxHeight
    );

    rowItems.forEach(item => {
      const index = photoData.indexOf(item);

      const card = document.createElement("button");
      card.type = "button";
      card.className = "artwork";

      const width = imageHeight * item.ratio;

      card.style.width = width + "px";

      if (item.loaded) {
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title;

        img.style.width = width + "px";
        img.style.height = imageHeight + "px";
        img.style.objectFit = "contain";

        card.appendChild(img);
      } else {
        const missing = document.createElement("div");
        missing.className = "missing";
        missing.textContent = "MISSING: " + item.image;
        missing.style.height = imageHeight + "px";
        card.appendChild(missing);
        card.disabled = true;
      }

      const label = document.createElement("span");
      label.className = "artwork-number";
      label.textContent =
        String(index + 1).padStart(3, "0");

      card.appendChild(label);

      if (item.loaded) {
        card.setAttribute(
          "aria-label",
          "View " + item.title
        );

        card.addEventListener("click", () => {
          openViewer(item, index);
        });
      }

      row.appendChild(card);
    });

    wall.appendChild(row);
  });

  document.getElementById("counter").textContent =
    "WALK / " +
    String(photoData.length).padStart(3, "0") +
    " OBSERVATIONS";
}

async function init() {
  photoData = await Promise.all(
    observations.map(loadImage)
  );

  renderGallery();
}

let resizeTimer;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    renderGallery();
    alignViewerText();
  }, 100);
});

init();

</script>

</body>
</html>
