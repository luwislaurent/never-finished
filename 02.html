
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALK 2 — Observation Archive</title>

<style>
:root {
  --wall: #f5f4ef;
  --ink: #171717;
  --muted: #85847f;
  --accent: #eaff00;
  --image-tone: #d9d8d2;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--wall);
}

body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: Futura, Helvetica, Arial, sans-serif;
}

/* BIJNA ONZICHTBARE NAVIGATIE */

header {
  padding: 25px clamp(20px, 4vw, 70px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

header a {
  color: var(--ink);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -.02em;
}

header a:hover {
  text-decoration: underline;
}

header span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
}

/* DE WITTE GALERIJMUUR */

.gallery {
  padding: clamp(65px, 12vh, 180px)
           clamp(22px, 6vw, 110px)
           15vh;
  min-height: 85vh;
}

/*
  DE FOTO'S BEPALEN DE LAYOUT

  JavaScript berekent de grootte van
  elk beeld aan de hand van:
  - de hoeveelheid foto's
  - staand / liggend / vierkant
  - de echte beeldverhouding

  De pagina is dus geen vast sjabloon.
*/

.gallery-wall {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: 10px;
  grid-auto-flow: row dense;
  column-gap: clamp(8px, 1.8vw, 26px);
  row-gap: 10px;
  align-items: start;
}

.artwork {
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  cursor: pointer;
  color: inherit;
  text-align: left;
  grid-column: span var(--span, 4);
  grid-row: span var(--rows, 20);
}

.artwork-image {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e5e4df;
  overflow: hidden;
  transition: transform .4s ease;
}

.artwork-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.artwork:hover .artwork-image {
  transform: translateY(-5px);
}

.artwork-number {
  flex-shrink: 0;
  padding-top: 9px;
  height: 25px;
  font-size: 10px;
  font-weight: 500;
  color: #797974;
  letter-spacing: .04em;
}

/* ALS EEN FOTO NOG NIET BESTAAT */

.missing {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 15px;
  text-align: center;
  color: var(--muted);
  font: 11px/1.5 Arial, sans-serif;
  overflow-wrap: anywhere;
}

/* KLEINE MUSEUMVOETTEKST */

footer {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 25px clamp(20px, 4vw, 70px);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .05em;
}

footer a {
  color: inherit;
  text-decoration: none;
}

footer a:hover {
  color: var(--ink);
}

/* EEN FOTO ALS KUNSTWERK OPENEN */

.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--wall);
  padding: clamp(20px, 4vw, 65px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.viewer.open {
  display: flex;
}

.close {
  position: absolute;
  top: 22px;
  right: clamp(20px, 4vw, 65px);
  border: 0;
  background: transparent;
  font: 12px Futura, Arial, sans-serif;
  cursor: pointer;
}

.viewer-image {
  display: block;
  max-width: 85%;
  max-height: 65vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.viewer-info {
  max-width: 500px;
  width: 85%;
  margin-top: 22px;
  text-align: left;
}

.viewer-number {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .07em;
}

.viewer-title {
  margin: 16px 0 8px;
  font-size: clamp(20px, 3vw, 38px);
  letter-spacing: -.06em;
  line-height: 1;
  font-weight: 900;
}

.viewer-note {
  margin: 0;
  font: 13px/1.5 Arial, sans-serif;
  color: #686762;
}

/* TELEFOON: ANDERE SCHALING, ZELFDE REGEL */

@media (max-width: 700px) {
  header {
    padding: 22px 20px;
  }

  .gallery {
    padding: 60px 18px 100px;
  }

  .gallery-wall {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    column-gap: 12px;
  }

  .artwork {
    grid-column: span var(--mobile-span, 3);
  }

  .artwork-number {
    font-size: 9px;
  }

  .viewer-image {
    max-width: 100%;
    max-height: 60vh;
  }

  .viewer-info {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">← WALK</a>
  <span>ARCHIVE / 002</span>
</header>

<main class="gallery">
  <div class="gallery-wall" id="gallery"></div>
</main>

<footer>
  <span id="count">WALK / OBSERVATIONS</span>
  <a href="index.html">NEVER FINISHED ↗</a>
</footer>

<!-- UITVERGROTE FOTO -->

<div class="viewer" id="viewer"
     role="dialog"
     aria-modal="true"
     aria-label="Observation detail">

  <button class="close" id="close">
    CLOSE ×
  </button>

  <img class="viewer-image" id="largeImage" alt="">

  <div class="viewer-info">
    <div class="viewer-number" id="viewerNumber"></div>
    <h2 class="viewer-title" id="viewerTitle"></h2>
    <p class="viewer-note" id="viewerNote"></p>
  </div>

</div>

<script>

/*
  JOUW ARCHIEF

  Elke foto = één ontdekking.
  Je hoeft niet elke dag te wandelen.

  Om iets toe te voegen:
  1. Upload je foto in de map "beeld".
  2. Voeg hieronder een observatie toe.
*/

const observations = [
  {
    date: "22.10.2026",
    image: "beeld/huis-01.jpg",
    title: "THE HOUSE GAVE UP.",
    note: "The windows are still pretending."
  },
  {
    date: "22.10.2026",
    image: "beeld/plant-01.jpg",
    title: "THE PLANT LOOKED SAD.",
    note: "Nobody seemed particularly concerned."
  },
  {
    date: "25.10.2026",
    image: "beeld/straat-01.jpg",
    title: "A VERY PRIVATE DISASTER.",
    note: "Everyone walked past it."
  },
  {
    date: "29.10.2026",
    image: "beeld/huis-02.jpg",
    title: "NOBODY LIVES HERE.",
    note: "But someone still cuts the grass."
  },
  {
    date: "02.11.2026",
    image: "beeld/detail-01.jpg",
    title: "STILL WAITING.",
    note: "For what, exactly?"
  }
];

const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const largeImage = document.getElementById("largeImage");
const viewerNumber = document.getElementById("viewerNumber");
const viewerTitle = document.getElementById("viewerTitle");
const viewerNote = document.getElementById("viewerNote");

let lastFocused = null;

function labelNumber(index) {
  return String(index + 1).padStart(3, "0");
}

/*
  BEELDINFORMATIE OPHALEN

  De werkelijke afmetingen bepalen
  hoeveel ruimte iedere foto krijgt.
*/

function loadImage(item) {
  return new Promise(resolve => {
    const image = new Image();

    image.onload = () => {
      resolve({
        ...item,
        ratio: image.naturalWidth / image.naturalHeight,
        loaded: true
      });
    };

    image.onerror = () => {
      resolve({
        ...item,
        ratio: 1,
        loaded: false
      });
    };

    image.src = item.image;
  });
}

/*
  BEPAAL DE GROOTTE OP DE MUUR.

  Bij veel foto's worden de werken
  iets compacter. Staande foto's
  krijgen een andere breedte dan
  liggende foto's.
*/

function getSpan(item, count, mobile) {
  const ratio = item.ratio;
  let span;

  if (mobile) {
    span = ratio > 1.3 ? 5 :
           ratio < 0.85 ? 3 : 4;
    return Math.min(6, span);
  }

  if (ratio > 1.5) span = 6;
  else if (ratio > 1.15) span = 5;
  else if (ratio < 0.75) span = 3;
  else span = 4;

  if (count <= 2) span = Math.min(8, span + 2);
  if (count >= 10) span = Math.max(3, span - 1);

  return span;
}

/*
  GEEF ELK KUNSTWERK ZIJN EIGEN PLEK.
  De hoogtes volgen de fotoverhouding.
*/

function sizeArtwork(card, item, count) {
  const mobile = window.innerWidth <= 700;
  const span = getSpan(item, count, mobile);

  card.style.setProperty(
    mobile ? "--mobile-span" : "--span",
    span
  );

  const wall = gallery;
  const style = getComputedStyle(wall);
  const columns = mobile ? 6 : 12;
  const gap = parseFloat(style.columnGap) || 12;
  const width = wall.clientWidth;

  const cellWidth =
    (width - (columns - 1) * gap) / columns;

  const artworkWidth =
    cellWidth * span + gap * (span - 1);

  const photoHeight = Math.min(
    artworkWidth / item.ratio,
    window.innerHeight * 0.72
  );

  const totalHeight = photoHeight + 25;
  const rows = Math.ceil((totalHeight + 10) / 20);

  card.style.setProperty("--rows", rows);
}

/* OPEN EEN FOTO */

function openViewer(item, index) {
  lastFocused = document.activeElement;

  largeImage.src = item.image;
  largeImage.alt = item.title;

  viewerNumber.textContent =
    labelNumber(index) + " / " + item.date;

  viewerTitle.textContent = item.title;
  viewerNote.textContent = item.note;

  viewer.classList.add("open");
  document.body.style.overflow = "hidden";

  document.getElementById("close").focus();
}

function closeViewer() {
  viewer.classList.remove("open");
  document.body.style.overflow = "";
  largeImage.removeAttribute("src");

  if (lastFocused) lastFocused.focus();
}

document.getElementById("close")
  .addEventListener("click", closeViewer);

viewer.addEventListener("click", event => {
  if (event.target === viewer) closeViewer();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeViewer();
});

/* BOUW DE GALERIJ */

let artworks = [];

async function buildGallery() {
  const data = await Promise.all(
    observations.map(loadImage)
  );

  gallery.innerHTML = "";
  artworks = [];

  data.forEach((item, index) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "artwork";

    const imageArea = document.createElement("div");
    imageArea.className = "artwork-image";

    if (item.loaded) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.title;
      imageArea.appendChild(img);
    } else {
      const missing = document.createElement("div");
      missing.className = "missing";
      missing.textContent = "MISSING: " + item.image;
      imageArea.appendChild(missing);
    }

    const number = document.createElement("div");
    number.className = "artwork-number";
    number.textContent = labelNumber(index);

    card.append(imageArea, number);

    if (item.loaded) {
      card.setAttribute(
        "aria-label",
        "View observation " + labelNumber(index)
      );

      card.addEventListener("click", () => {
        openViewer(item, index);
      });
    } else {
      card.disabled = true;
    }

    gallery.appendChild(card);
    artworks.push({ card, item });
  });

  resizeGallery();

  document.getElementById("count").textContent =
    "WALK / " +
    String(data.length).padStart(3, "0") +
    " OBSERVATIONS";
}

function resizeGallery() {
  artworks.forEach(({card, item}) => {
    sizeArtwork(card, item, artworks.length);
  });
}

window.addEventListener("resize", resizeGallery);

buildGallery();

</script>

</body>
</html>
